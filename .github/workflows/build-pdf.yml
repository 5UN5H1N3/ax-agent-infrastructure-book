name: Build PDF

on:
  workflow_dispatch:
  push:
    paths:
      - "book/AX_Agent_Infrastructure_Book_RU.html"
      - ".github/workflows/build-pdf.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install WeasyPrint
        run: |
          python -m pip install --upgrade pip
          python -m pip install "weasyprint==68.0"

      - name: Build PDF
        run: |
          weasyprint             book/AX_Agent_Infrastructure_Book_RU.html             AX_Agent_Infrastructure_Book_RU.pdf
          sha256sum AX_Agent_Infrastructure_Book_RU.pdf > CHECKSUMS.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax-agent-infrastructure-book
          path: |
            AX_Agent_Infrastructure_Book_RU.pdf
            CHECKSUMS.sha256
