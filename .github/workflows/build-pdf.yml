name: Build book PDF

on:
  workflow_dispatch:
  push:
    paths:
      - "book/AX_Agent_Infrastructure_Book_RU.html"
      - "assets/**"
      - "scripts/inject_cover.py"
      - "scripts/rebuild_diagrams.py"
      - "scripts/publish_generated_artifacts.py"
      - ".github/workflows/build-pdf.yml"

permissions:
  contents: write

concurrency:
  # PDF and web jobs both publish generated files to main.
  group: book-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PDF and diagram dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libpango-1.0-0 libpangoft2-1.0-0 poppler-utils
          python -m pip install --upgrade pip
          python -m pip install "weasyprint==68.0" "beautifulsoup4==4.15.0" "lxml==6.0.2"

      - name: Rebuild diagrams
        run: |
          python scripts/rebuild_diagrams.py \
            book/AX_Agent_Infrastructure_Book_RU.html \
            book/.diagram-source.html

      - name: Inject publication cover
        run: |
          python scripts/inject_cover.py \
            book/.diagram-source.html \
            book/.print-source.html

      - name: Build and validate PDF
        run: |
          weasyprint \
            book/.print-source.html \
            book/AX_Agent_Infrastructure_Book_RU.pdf

          pages="$(pdfinfo book/AX_Agent_Infrastructure_Book_RU.pdf | awk '/^Pages:/ {print $2}')"
          echo "Generated PDF pages: $pages"
          test "$pages" -ge 80
          test -s book/AX_Agent_Infrastructure_Book_RU.pdf

          (
            cd book
            sha256sum \
              AX_Agent_Infrastructure_Book_RU.pdf \
              AX_Agent_Infrastructure_Book_RU.html \
              > CHECKSUMS.sha256
          )

      - name: Commit generated PDF and checksums
        run: |
          python scripts/publish_generated_artifacts.py \
            --branch main \
            --message "build: refresh PDF with redrawn diagrams [skip ci]" \
            book/AX_Agent_Infrastructure_Book_RU.pdf \
            book/CHECKSUMS.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ax-agent-infrastructure-book
          path: |
            book/AX_Agent_Infrastructure_Book_RU.pdf
            book/AX_Agent_Infrastructure_Book_RU.html
            book/CHECKSUMS.sha256
            assets/

# Publication trigger: chapter 25
