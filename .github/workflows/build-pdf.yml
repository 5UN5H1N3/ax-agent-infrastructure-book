name: Build book PDF

on:
  workflow_dispatch:
  push:
    paths:
      - "book/AX_Agent_Infrastructure_Book_RU.html"
      - "assets/cover.svg"
      - "scripts/inject_cover.py"
      - ".github/workflows/build-pdf.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 poppler-utils
          python -m pip install --upgrade pip
          python -m pip install "weasyprint==68.0" beautifulsoup4

      - name: Inject publication cover
        run: |
          python scripts/inject_cover.py             book/AX_Agent_Infrastructure_Book_RU.html             book/.print-source.html

      - name: Build and validate PDF
        run: |
          weasyprint             book/.print-source.html             book/AX_Agent_Infrastructure_Book_RU.pdf

          pages="$(pdfinfo book/AX_Agent_Infrastructure_Book_RU.pdf | awk '/^Pages:/ {print $2}')"
          echo "Generated PDF pages: $pages"
          test "$pages" = "100"

          (
            cd book
            sha256sum               AX_Agent_Infrastructure_Book_RU.pdf               AX_Agent_Infrastructure_Book_RU.html               > CHECKSUMS.sha256
          )

      - name: Commit generated PDF and checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             book/AX_Agent_Infrastructure_Book_RU.pdf             book/CHECKSUMS.sha256

          if git diff --cached --quiet; then
            echo "Generated artifacts are unchanged."
          else
            git commit -m "build: refresh PDF with publication cover [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax-agent-infrastructure-book
          path: |
            book/AX_Agent_Infrastructure_Book_RU.pdf
            book/AX_Agent_Infrastructure_Book_RU.html
            book/CHECKSUMS.sha256
            assets/cover.svg
