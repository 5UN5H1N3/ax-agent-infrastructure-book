name: Publish book

on:
  workflow_dispatch:
  push:
    paths:
      - "book/source/html-gz/**"
      - ".github/workflows/build-pdf.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct HTML source
        shell: bash
        run: |
          cat             book/source/html-gz/part-00.b64             book/source/html-gz/part-01.b64             book/source/html-gz/part-02.b64             book/source/html-gz/rem-00.b64             book/source/html-gz/rem-01.b64             book/source/html-gz/rem-02.b64             book/source/html-gz/rem-03.b64             book/source/html-gz/rem-04.b64             > /tmp/book.html.gz.b64

          base64 -d /tmp/book.html.gz.b64 > /tmp/book.html.gz
          gzip -dc /tmp/book.html.gz > book/AX_Agent_Infrastructure_Book_RU.html

          echo "f6907ff5a9a676d9685620ca19acdf09d8a69b6926c50bda8cf0006c867f10e0  book/AX_Agent_Infrastructure_Book_RU.html" | sha256sum -c -

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 poppler-utils
          python -m pip install --upgrade pip
          python -m pip install "weasyprint==68.0"

      - name: Build and validate PDF
        run: |
          weasyprint             book/AX_Agent_Infrastructure_Book_RU.html             book/AX_Agent_Infrastructure_Book_RU.pdf

          pages="$(pdfinfo book/AX_Agent_Infrastructure_Book_RU.pdf | awk '/^Pages:/ {print $2}')"
          echo "Generated PDF pages: $pages"
          test "$pages" = "100"

          (
            cd book
            sha256sum               AX_Agent_Infrastructure_Book_RU.pdf               AX_Agent_Infrastructure_Book_RU.html               > CHECKSUMS.sha256
          )

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             book/AX_Agent_Infrastructure_Book_RU.html             book/AX_Agent_Infrastructure_Book_RU.pdf             book/CHECKSUMS.sha256

          if git diff --cached --quiet; then
            echo "Generated artifacts are unchanged."
          else
            git commit -m "build: publish book artifacts [skip ci]"
            git push
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax-agent-infrastructure-book
          path: |
            book/AX_Agent_Infrastructure_Book_RU.pdf
            book/AX_Agent_Infrastructure_Book_RU.html
            book/CHECKSUMS.sha256
