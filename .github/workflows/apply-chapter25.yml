name: Apply chapter 25 publication

on:
  push:
    paths:
      - "patches/chapter25.patch"
      - ".github/workflows/apply-chapter25.yml"

permissions:
  contents: write

concurrency:
  group: chapter25-publication
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply chapter patch and remove staging files
        run: |
          git apply --check patches/chapter25.patch
          git apply patches/chapter25.patch
          rm patches/chapter25.patch
          rm .github/workflows/apply-chapter25.yml

      - name: Commit canonical chapter source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book/AX_Agent_Infrastructure_Book_RU.html
          git add -u patches/chapter25.patch .github/workflows/apply-chapter25.yml
          git commit -m "docs: deepen chapter 25 observability"
          git push origin HEAD:main
