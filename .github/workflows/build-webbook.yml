name: Build GitBook web edition

on:
  workflow_dispatch:
  push:
    paths:
      - "book/AX_Agent_Infrastructure_Book_RU.html"
      - "assets/**"
      - "scripts/build_webbook.py"
      - "scripts/rebuild_diagrams.py"
      - "scripts/publish_generated_artifacts.py"
      - ".github/workflows/build-webbook.yml"

permissions:
  contents: write

concurrency:
  # PDF and web jobs both publish generated files to main.
  group: book-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install converter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libcairo2 libffi-dev
          python -m pip install --upgrade pip
          python -m pip install             "beautifulsoup4==4.15.0"             "markdownify==1.2.3"             "CairoSVG==2.9.1" \
            "lxml==6.0.2"

      - name: Rebuild diagrams
        run: |
          python scripts/rebuild_diagrams.py \
            book/AX_Agent_Infrastructure_Book_RU.html \
            book/.web-source.html

      - name: Generate GitBook Markdown and raster assets
        run: python scripts/build_webbook.py book/.web-source.html

      - name: Validate web edition
        run: |
          test -f docs/README.md
          test -f docs/SUMMARY.md
          test -f docs/gitbook-docs.yaml
          test -f docs/.gitbook/assets/cover.png
          test -f docs/.gitbook/assets/social-preview.png
          test -f docs/.gitbook/assets/favicon.png

          pages="$(find docs -maxdepth 1 -name '*.md' | wc -l)"
          svg_diagrams="$(find docs/.gitbook/assets/diagrams -name '*.svg' | wc -l)"
          png_diagrams="$(find docs/.gitbook/assets/diagrams -name '*.png' | wc -l)"
          referenced_diagrams="$(python -c 'from pathlib import Path; import re; print(len({ref for page in Path("docs").glob("*.md") for ref in re.findall(r"\.gitbook/assets/diagrams/[^)]+\.png", page.read_text(encoding="utf-8"))}))')"

          echo "Markdown files: $pages"
          echo "Referenced diagrams: $referenced_diagrams"
          echo "SVG diagrams: $svg_diagrams"
          echo "PNG diagrams: $png_diagrams"

          test "$pages" = "49"
          test "$referenced_diagrams" -ge 41
          test "$svg_diagrams" = "$referenced_diagrams"
          test "$png_diagrams" = "$referenced_diagrams"

      - name: Commit generated web edition
        run: |
          python scripts/publish_generated_artifacts.py \
            --branch main \
            --message "docs: publish collision-free redrawn diagrams [skip ci]" \
            docs

# Publication trigger: chapter 26
