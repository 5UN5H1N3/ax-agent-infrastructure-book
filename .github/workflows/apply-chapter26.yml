name: Apply chapter 26 publication

on:
  push:
    branches: [main]
    paths:
      - "patches/chapter26.patch"
      - ".github/workflows/apply-chapter26.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply chapter patch and remove staging files
        run: |
          git apply --check patches/chapter26.patch
          git apply patches/chapter26.patch
          rm patches/chapter26.patch .github/workflows/apply-chapter26.yml
      - name: Commit canonical chapter source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book/AX_Agent_Infrastructure_Book_RU.html
          git add -u patches/chapter26.patch .github/workflows/apply-chapter26.yml
          git commit -m "docs: deepen chapter 26 lab infrastructure"
          git push origin HEAD:main
