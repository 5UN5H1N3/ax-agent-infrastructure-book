<svg aria-label="Snapshot ownership: URI lifetime matters for clones and garbage collection" class="diagram" height="315" role="img" viewbox="0 0 890 315" width="890" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerheight="10" markerunits="strokeWidth" markerwidth="10" orient="auto" refx="8" refy="3"><path d="M0,0 L0,6 L9,3 z" fill="#53657a"></path></marker></defs><line marker-end="url(#arrow)" stroke="#53657a" stroke-width="2" x1="185" x2="240" y1="82.5" y2="82.5"></line><text fill="#5c6875" font-size="10" text-anchor="middle" x="212.5" y="76.5">owns</text><line marker-end="url(#arrow)" stroke="#53657a" stroke-width="2" x1="185" x2="240" y1="232.5" y2="232.5"></line><text fill="#5c6875" font-size="10" text-anchor="middle" x="212.5" y="226.5">owns</text><line marker-end="url(#arrow)" stroke="#53657a" stroke-width="2" x1="400" x2="485" y1="232.5" y2="232.5"></line><text fill="#5c6875" font-size="10" text-anchor="middle" x="442.5" y="226.5">borrow</text><line marker-end="url(#arrow)" stroke="#53657a" stroke-width="2" x1="645" x2="700" y1="232.5" y2="232.5"></line><text fill="#5c6875" font-size="10" text-anchor="middle" x="672.5" y="226.5">first suspend</text><rect fill="#f8efff" height="65" rx="12" ry="12" stroke="#70459b" stroke-width="1.5" width="160" x="25" y="50"></rect><text fill="#17212b" font-size="14" font-weight="700" text-anchor="middle" x="105.0" y="74">Actor A</text><text fill="#465569" font-size="11" text-anchor="middle" x="105.0" y="95">owns current snapshot</text><rect fill="#fff7e8" height="65" rx="12" ry="12" stroke="#9a6410" stroke-width="1.5" width="160" x="240" y="50"></rect><text fill="#17212b" font-size="14" font-weight="700" text-anchor="middle" x="320.0" y="74">Actor snapshot</text><text fill="#465569" font-size="11" text-anchor="middle" x="320.0" y="95">replaced on next suspend</text><rect fill="#edf4ff" height="65" rx="12" ry="12" stroke="#2d5d9f" stroke-width="1.5" width="160" x="25" y="200"></rect><text fill="#17212b" font-size="14" font-weight="700" text-anchor="middle" x="105.0" y="224">Tag</text><text fill="#465569" font-size="11" text-anchor="middle" x="105.0" y="245">owns copied snapshot</text><rect fill="#fff7e8" height="65" rx="12" ry="12" stroke="#9a6410" stroke-width="1.5" width="160" x="240" y="200"></rect><text fill="#17212b" font-size="14" font-weight="700" text-anchor="middle" x="320.0" y="224">Tag snapshot</text><text fill="#465569" font-size="11" text-anchor="middle" x="320.0" y="245">lives until tag delete</text><rect fill="#eefaf3" height="65" rx="12" ry="12" stroke="#287a4b" stroke-width="1.5" width="160" x="485" y="200"></rect><text fill="#17212b" font-size="14" font-weight="700" text-anchor="middle" x="565.0" y="224">Cloned Actor</text><text fill="#465569" font-size="11" text-anchor="middle" x="565.0" y="245">borrows tag URI</text><rect fill="#f3f5f7" height="65" rx="12" ry="12" stroke="#495463" stroke-width="1.5" width="160" x="700" y="200"></rect><text fill="#17212b" font-size="14" font-weight="700" text-anchor="middle" x="780.0" y="224">Own snapshot</text><text fill="#465569" font-size="11" text-anchor="middle" x="780.0" y="245">after first suspend</text></svg>